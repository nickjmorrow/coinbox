name: Coinbox
options:
  bundleIdPrefix: com.nicholai
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CoinboxUI:
    path: ../UI
schemes:
  # Running from Xcode installs the optimized build: a Debug build of the app, CoinboxCore and GRDB is far slower on the phone.
  CoinboxiOS:
    build:
      targets:
        CoinboxiOS: all
    run:
      config: Release
    test:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
targets:
  Coinbox:
    type: application
    platform: macOS
    sources: [Mac]
    dependencies:
      - package: CoinboxUI
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Coinbox
        # The sync hub is reached over Tailscale by plain HTTP (the tunnel is encrypted); App Transport Security would refuse that.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholai.coinbox
        PRODUCT_NAME: Coinbox
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coinbox
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5.0"
  CoinboxWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Coinbox
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/CoinboxWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nicholai.coinbox]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholai.coinbox.ios.widgets
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        PRODUCT_NAME: CoinboxWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coinbox
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
  CoinboxiOS:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    info:
      path: iOS/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    dependencies:
      - package: CoinboxUI
      - target: CoinboxWidgets
    entitlements:
      path: iOS/Coinbox.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nicholai.coinbox]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholai.coinbox.ios
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        PRODUCT_NAME: Coinbox
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coinbox
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5.0"
